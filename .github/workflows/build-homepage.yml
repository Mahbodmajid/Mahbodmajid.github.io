name: Build Homepage

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - index.md
      - meta-head.html
      - pandoc.css
      - compile.sh
      - .github/workflows/build-homepage.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Rebuild homepage
        run: |
          chmod +x compile.sh
          ./compile.sh

      - name: Commit generated HTML
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-build index.html from index.md [skip ci]"
          git push
